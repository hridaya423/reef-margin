<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coralitics Logo Variants</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root { --ink: #0f0f0d; --paper: #ffffff; --coral: #9a6235; --bleach: #efe6d6; --lime: #e4f222; --muted: #6b6a63; }
  .sheet { display: grid; gap: 20px; font-family: "Hanken Grotesk", system-ui, sans-serif; color: var(--foreground, #0f0f0d); }
  .v { border: 1px solid var(--border, #e6e4df); border-radius: 16px; overflow: hidden; }
  .v-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 12px 16px; font-size: 13px; }
  .v-head b { font-size: 14px; }
  .v-head span { color: var(--muted-foreground, #6b6a63); }
  .row { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1.1fr) 120px; }
  .tile { display: grid; place-items: center; min-height: 120px; padding: 16px; }
  .light { background: var(--paper); }
  .dark { background: var(--ink); color: #fff; }
  .small { background: #f6f5f2; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; }
  .small .sizes { display: flex; gap: 10px; align-items: center; }
  .note { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 12px 16px 14px; font-size: 12px; line-height: 17px; color: var(--muted-foreground, #4a4943); border-top: 1px solid var(--border, #e6e4df); }
  .note b { color: var(--foreground, #0f0f0d); font-weight: 600; }
  .wm { display: inline-flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.02em; line-height: 1; white-space: nowrap; }
  .wm .t { font-size: 34px; }
  .dark .wm { color: #fff; }
  .serif { font-family: "Instrument Serif", serif; font-weight: 400; letter-spacing: -0.01em; }
  .ti { position: relative; display: inline-block; }
  .ti::after { content: ""; position: absolute; left: 50%; top: 0.04em; width: 0.22em; height: 0.22em; border-radius: 50%; transform: translateX(-50%); }
  .ti.a::after { background: var(--coral); }
  .ti.b::after { background: var(--bleach); box-shadow: inset 0 0 0 0.035em currentColor; }
  @media (max-width: 600px) { .row { grid-template-columns: 1fr; } .note { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="sheet" id="sheet"></div>
<script>
const CORAL = "#9a6235", BLEACH = "#efe6d6", INK = "#0f0f0d", LIME = "#e4f222";

function mix(a, b, t) {
  const p = (h) => [1, 3, 5].map((k) => parseInt(h.slice(k, k + 2), 16));
  const [x, y] = [p(a), p(b)];
  return "#" + x.map((v, k) => Math.round(v + (y[k] - v) * t).toString(16).padStart(2, "0")).join("");
}

const ring = (mono, fg) => {
  let s = "";
  const n = 22;
  for (let k = 0; k < n; k++) {
    const a = ((40 + (280 * k) / (n - 1)) * Math.PI) / 180;
    const c = mono ? fg : mix("#8c582c", "#d8c9b1", k / (n - 1));
    const x1 = 24 + 11 * Math.cos(a), y1 = 24 - 11 * Math.sin(a), x2 = 24 + 20 * Math.cos(a), y2 = 24 - 20 * Math.sin(a);
    s += `<line x1="${x1.toFixed(2)}" y1="${y1.toFixed(2)}" x2="${x2.toFixed(2)}" y2="${y2.toFixed(2)}" stroke="${c}" stroke-width="3.2" stroke-linecap="round"/>`;
  }
  return s;
};

const split = (fg) => `<clipPath id="L${fg.slice(1)}"><rect x="0" y="0" width="24" height="48"/></clipPath><circle cx="24" cy="24" r="17" fill="${BLEACH}" stroke="${fg}" stroke-width="2.4"/><circle cx="24" cy="24" r="17" fill="${CORAL}" clip-path="url(#L${fg.slice(1)})"/><circle cx="24" cy="24" r="17" fill="none" stroke="${fg}" stroke-width="2.4"/>`;

const branch = (fg, tip) => `<g fill="none" stroke="${fg}" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 42V24"/><path d="M24 31c0-6-9-7-9-15"/><path d="M24 27c0-5 9-6 9-14"/><path d="M24 24V11"/></g><g fill="${tip}" stroke="${fg}" stroke-width="2.2"><circle cx="15" cy="13" r="3.6"/><circle cx="33" cy="10" r="3.6"/><circle cx="24" cy="8" r="3.6"/></g>`;

const wave = () => `<circle cx="24" cy="24" r="21" fill="${LIME}"/><path d="M12 29c5-7.5 10-7.5 12.5-2.5s7.5 5 12.5-2.5" stroke="${INK}" stroke-width="3.8" fill="none" stroke-linecap="round"/>`;

const svg = (inner, size) => `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true">${inner}</svg>`;

const icon = (inner, bg, size) => `<svg width="${size}" height="${size}" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="${bg}"/><g transform="translate(6 6) scale(0.75)">${inner}</g></svg>`;

const V = [
  {
    name: "01, Split polyp, Hanken Grotesk 600",
    arch: "Letterform-as-symbol",
    lockup: (dark) => `<span class="wm" style="gap:0"><span class="t">c</span><span style="display:inline-block;margin:0 1px;transform:translateY(3px)">${svg(split(dark ? "#ffffff" : INK), 22)}</span><span class="t">ralitics</span></span>`,
    mark: (d) => split(d ? "#ffffff" : INK),
    iconBg: "#ffffff",
    signals: "The o is a coral half alive, half bleached. One glance says the product: the same reef, two futures. Favicon is the o alone.",
    rejects: "Wave clichés. Risk: a half-filled circle is also the common contrast icon in software, so it is the least ownable symbol here.",
  },
  {
    name: "02, Decade ring, Hanken Grotesk 600",
    arch: "Lockup (symbol + wordmark)",
    lockup: (dark) => `<span class="wm">${svg(ring(false), 42)}<span class="t">coralitics</span></span>`,
    mark: (d) => ring(false),
    iconBg: "#ffffff",
    signals: "A C made of years, fading from healthy brown to bleached, the same strip the app shows for every reef. Time and data in one mark.",
    rejects: "Literal coral drawings. Weaker in one colour, where it becomes a dotted C.",
  },
  {
    name: "03, Bleached tips, Hanken Grotesk 700",
    arch: "Lockup (symbol + wordmark)",
    lockup: (dark) => `<span class="wm">${svg(branch(dark ? "#ffffff" : INK, dark ? INK : "#ffffff"), 42)}<span class="t" style="font-weight:700">coralitics</span></span>`,
    mark: (d) => branch(INK, "#ffffff"),
    iconBg: LIME,
    signals: "A branching coral whose tips are data points, and white, because branch tips bleach first. Reads as coral and as a chart.",
    rejects: "Abstract geometry. Closest to the category default, so it relies on the lime and the tips for character.",
  },
  {
    name: "04, Tittles, Hanken Grotesk 600",
    arch: "Wordmark only",
    lockup: (dark) => `<span class="wm"><span class="t">coral<span class="ti a">ı</span>t<span class="ti b">ı</span>cs</span></span>`,
    mark: (d) => `<circle cx="16" cy="24" r="8" fill="${CORAL}"/><circle cx="33" cy="24" r="8" fill="${BLEACH}" stroke="${INK}" stroke-width="2.2"/>`,
    iconBg: "#ffffff",
    signals: "The two dots on the i's are before and after: one living, one bleached. Quiet, clever on second look, very typographic.",
    rejects: "Symbols entirely. Too subtle for a 2-second pitch slide; the favicon must fall back to the two dots.",
  },
  {
    name: "05, Research serif, Instrument Serif",
    arch: "Lockup (symbol + wordmark)",
    lockup: (dark) => `<span class="wm">${svg(split(dark ? "#ffffff" : INK), 34)}<span class="t serif" style="font-size:40px">Coralitics</span></span>`,
    mark: (d) => split(INK),
    iconBg: "#ffffff",
    signals: "An open science institution: journals, field stations, long horizons. Fits the open-source pitch and the ARIA audience.",
    rejects: "Startup energy. The serif clashes with the Hanken Grotesk app UI unless the app adopts it for headlines.",
  },
  {
    name: "06, Continuity, Hanken Grotesk 600",
    arch: "Lockup (symbol + wordmark)",
    lockup: (dark) => `<span class="wm">${svg(wave(), 34)}<span class="t">Coralitics</span></span>`,
    mark: (d) => wave(),
    iconBg: "#ffffff",
    signals: "Keeps the lime wave the demo already uses, so nothing else changes before the pitch.",
    rejects: "Says water, not coral or bleaching. The least ownable option.",
  },
];

document.getElementById("sheet").innerHTML = V.map((v) => `
  <section class="v">
    <div class="v-head"><b>${v.name}</b><span>${v.arch}</span></div>
    <div class="row">
      <div class="tile light">${v.lockup(false)}</div>
      <div class="tile dark">${v.lockup(true)}</div>
      <div class="tile small">
        ${icon(v.mark(false), v.iconBg, 56)}
        <div class="sizes">${svg(v.mark(false), 32)}${svg(v.mark(false), 16)}</div>
      </div>
    </div>
    <div class="note"><div><b>Signals.</b> ${v.signals}</div><div><b>Rejects.</b> ${v.rejects}</div></div>
  </section>`).join("");
</script>
</body>
</html>
